name: Validar y publicar biblioteca
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ORDEN CORREGIDO: antes "Validar" corría antes de "Construir", así que validaba
      # un site/catalogo.json viejo, no el que realmente se iba a publicar. Ahora se
      # construye primero y se valida el resultado real — si falla, el deploy se detiene.
      - name: Construir índice
        run: python scripts/construir_indice.py
      - name: Validar catálogo
        run: python scripts/validar_catalogo.py
      - name: Exportar Moodle
        run: python scripts/exportar_moodle.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
